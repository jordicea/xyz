<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="<%= BASE_URL %>favicon.svg">
    <title>Jordi Cea, software engineer</title>

    <!-- Google Analytics - GDPR Compliant -->
    <script>
      // Initialize dataLayer before any GA code
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Set default consent to 'denied' for GDPR compliance
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied'
      });

      // Check if user has already consented
      const consent = localStorage.getItem('cookie-consent');
      if (consent === 'accepted') {
        // User previously accepted - grant consent and load GA
        gtag('consent', 'update', {
          'analytics_storage': 'granted'
        });

        // Dynamically load GA script only after consent
        const script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-BZY5CJW9D0';
        document.head.appendChild(script);

        script.onload = function() {
          gtag('js', new Date());
          gtag('config', 'G-BZY5CJW9D0', {
            'anonymize_ip': true
          });
        };
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
