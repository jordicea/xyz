[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Idioma por defecto: inglés. Si el navegador está en castellano o catalán, se redirige.
[[redirects]]
  from = "/"
  to = "/es/"
  status = 302
  force = true
  conditions = { Language = ["es"] }

[[redirects]]
  from = "/"
  to = "/ca/"
  status = 302
  force = true
  conditions = { Language = ["ca"] }

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true

# Ruta antigua de la SPA
[[redirects]]
  from = "/about"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
